{% extends 'base.html' %}

{% block title %}Log In - AI Career Mentor{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-glass p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; background: rgba(6, 182, 212, 0.15); color: #38bdf8;">
                        <i class="fa-solid fa-right-to-bracket fa-xl"></i>
                    </div>
                    <h2 class="h3 text-white fw-bold">Welcome Back</h2>
                    <p class="text-secondary small">Sign in to access your dashboard & recommendations</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label form-label-custom" for="id_username">Email or Username</label>
                        <input type="text" name="username" class="form-control form-control-custom" id="id_username" placeholder="name@example.com or username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label form-label-custom" for="id_password">Password</label>
                        <input type="password" name="password" class="form-control form-control-custom" id="id_password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                    <p class="text-secondary small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-indigo-400 text-decoration-none fw-semibold" style="color: #818cf8;">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
